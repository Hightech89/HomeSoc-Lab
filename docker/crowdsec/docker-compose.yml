name: homesoc-crowdsec

services:
  crowdsec:
    image: crowdsecurity/crowdsec:${CROWDSEC_IMAGE_TAG:-latest}
    container_name: ${CROWDSEC_CONTAINER_NAME:-crowdsec}
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-America/Chicago}
      COLLECTIONS: ${CROWDSEC_COLLECTIONS:-crowdsecurity/linux crowdsecurity/sshd}
      GID: ${CROWDSEC_GID:-1000}
    ports:
      - "${CROWDSEC_LAPI_BIND:-127.0.0.1}:${CROWDSEC_LAPI_PORT:-8080}:8080"
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      - ./config/acquis.d:/etc/crowdsec/acquis.d:ro
      - ${HOST_LOG_DIR:-/var/log}:/var/log/host:ro
    networks:
      - homesoc
    healthcheck:
      test: ["CMD-SHELL", "cscli lapi status >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  crowdsec-config:
    name: ${CROWDSEC_CONFIG_VOLUME:-crowdsec-config}
  crowdsec-data:
    name: ${CROWDSEC_DATA_VOLUME:-crowdsec-data}

networks:
  homesoc:
    external: true
    name: ${HOMESOC_DOCKER_NETWORK:-homesoc}
